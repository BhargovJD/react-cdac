<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Var Let Const</title>

    <script>
      // =========================
      // 1. VAR
      // =========================

      var age = 30;

      console.log("var age:", age);

      // var value can be changed
      age = 31;

      console.log("var after change:", age);

      // =========================
      // 2. LET
      // =========================

      let salary = 60000;

      console.log("let salary:", salary);

      // let value can be changed
      salary = 65000;

      console.log("let after change:", salary);

      // =========================
      // 3. CONST
      // =========================

      const name = "Bhargov";

      console.log("const name:", name);

      // ❌ Cannot change const
      // name = "John";

      // =========================
      // REDECLARATION
      // =========================

      var city = "Guwahati";
      var city = "Delhi"; // ✅ Allowed

      console.log("var city:", city);

      let country = "India";
      // let country = "USA"; // ❌ Error

      const pi = 3.14;
      // const pi = 3.14159; // ❌ Error

      // Object
      const person = {
        name: "Bhargov",
        age: 30,

        greet: function () {
          console.log("Hello, I am " + this.name);
        },
      };

      console.log("Name", person.name);
      console.log("Age", person.age);

      person.greet();

      // Callback Function
      function greet() {
        console.log("Hello Bhargov, I am a callback function");
      }

      function executeFunction(callback) {
        callback();
      }

      executeFunction(greet);

      // Asynchronous JavaScript
      console.log("1");

      setTimeout(function () {
        console.log("2");
      }, 2000);

      console.log("3");
    </script>
  </head>

  <body>
    <h1>I am learning JavaScript</h1>
    <button id="btn">Click Me</button>

    <script>
      const button = document.getElementById("btn");

      button.addEventListener("click", function () {
        alert("Button clicked!");
      });
    </script>
  </body>
</html>
